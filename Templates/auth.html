<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Login' if mode == 'login' else 'Register' }} — WebRecon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
<div class="box">
    <div class="logo">WebRecon <span>/ {{ 'sign in' if mode == 'login' else 'register' }}</span></div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" placeholder="your username" required autofocus>
        <label>Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
        <button type="submit">{{ 'Sign in' if mode == 'login' else 'Create account' }}</button>
    </form>

    <div class="switch">
        {% if mode == 'login' %}
            No account? <a href="{{ url_for('register') }}">Register</a>
        {% else %}
            Have an account? <a href="{{ url_for('login') }}">Sign in</a>
        {% endif %}
    </div>
</div>
</body>
</html>
